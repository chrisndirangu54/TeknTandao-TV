name: Flutter static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android,web --project-name tekntandao_tv
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
